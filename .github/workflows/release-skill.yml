name: Release Skill

# skill/ is built from analyzify-mcp's release: merging its skill-sync PR
# runs this. The version is SKILL.md's frontmatter version: (the one the
# installed-skill check reads), so the tag and the files always agree.
on:
  push:
    branches: [main]
    paths:
      - "skill/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from SKILL.md
        id: version
        run: |
          set -euo pipefail
          VERSION=$(.github/scripts/skill-version.sh skill/SKILL.md)
          TAG="skill-v$VERSION"
          LATEST=$(git tag -l 'skill-v*' --sort=-v:refname | sed -n 1p)
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG exists already: a skill change needs a new version: in analyzify-mcp skill/SKILL.md"
            exit 1
          fi
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$TAG" "$LATEST" | sort -V | tail -1)" != "$TAG" ]; then
            echo "::error::$VERSION is below the last skill tag, $LATEST"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION from skill/SKILL.md (previous: ${LATEST:-none})"

      - name: Zip skill directory
        run: cd skill && zip -r "../analyzify-skill-v${{ steps.version.outputs.version }}.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Analyzify Skill ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest=false \
            "analyzify-skill-v${{ steps.version.outputs.version }}.zip"
