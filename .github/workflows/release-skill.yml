name: Release Skill

on:
  push:
    branches: [main]
    paths:
      - "skill/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"

          # Find latest skill-v* tag
          LATEST=$(git tag -l 'skill-v*' --sort=-v:refname | head -1)

          if [ -z "$LATEST" ]; then
            MAJOR=0; MINOR=1; PATCH=0
          else
            VER="${LATEST#skill-v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)

            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=skill-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION (bump: $BUMP, previous: ${LATEST:-none})"

      - name: Zip skill directory
        run: cd skill && zip -r "../analyzify-skill-v${{ steps.version.outputs.version }}.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Analyzify Skill ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "analyzify-skill-v${{ steps.version.outputs.version }}.zip"
